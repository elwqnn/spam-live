[package]
name = "api"
version = "0.1.0"
edition = "2024"

[features]
seed = []

[dependencies]
ammonia = "4.2.4"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
