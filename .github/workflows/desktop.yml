name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev libdbus-1-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile --filter desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPAM_SITE_URL: ${{ vars.SPAM_SITE_URL }}
        with:
          projectPath: desktop
          tauriScript: bun tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: desktop-v__VERSION__
          releaseName: SPAM Live desktop v__VERSION__
          releaseBody: Unsigned build. Windows SmartScreen can show a warning before the installer starts.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
